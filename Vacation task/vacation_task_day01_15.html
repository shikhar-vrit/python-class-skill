<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#201d19">
<title>Dashain Task — Day 01 to 15</title>
<style>
  :root{
    --bg:#f6f2ea; --paper:#fffdf8; --ink:#221f1a; --muted:#726b5e; --line:#e6ddc9;
    --accent-a:#b1502e; --accent-a-soft:#f3ded0;
    --accent-b:#2f5d52; --accent-b-soft:#dfe9e2;
    --dark:#201d19; --dark-ink:#f4efe4;
    --code-bg:#1c1815; --code-fg:#efe8db; --code-kw:#8fd6c4; --code-str:#e9b483; --code-cm:#8a8277; --code-fn:#e7cd8f;
    --shadow:0 26px 60px rgba(24,17,8,.22), 0 4px 14px rgba(24,17,8,.1);
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;overflow:hidden;background:var(--dark);color:var(--ink);font-family:var(--sans);}
  button{font:inherit;}
  .sprite{position:absolute;width:0;height:0;overflow:hidden;}
  .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .deck{min-height:100dvh;position:relative;background:var(--dark);}
  .brand{position:fixed;z-index:5;top:clamp(14px,2.4vw,26px);left:clamp(16px,3vw,38px);display:flex;align-items:center;gap:9px;color:var(--dark-ink);opacity:.72;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;}
  .brand .mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(244,239,228,.4);border-radius:5px;font-family:var(--serif);font-size:12px;font-weight:700;}

  .slides{min-height:100dvh;position:relative;z-index:1;}
  .slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:clamp(54px,6.5vw,80px) clamp(16px,5vw,80px) clamp(64px,7.5vw,92px);opacity:0;pointer-events:none;transform:translateX(38px);transition:opacity .22s ease, transform .32s cubic-bezier(.2,.75,.25,1);}
  .slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
  .slide.past{transform:translateX(-38px);}

  .frame{--tint:var(--accent-a);--tint-soft:var(--accent-a-soft);width:min(1180px,100%);height:min(700px,calc(100dvh - 120px));min-height:420px;position:relative;overflow:hidden;border-radius:10px;background:var(--paper);box-shadow:var(--shadow);}
  .frame.b{--tint:var(--accent-b);--tint-soft:var(--accent-b-soft);}
  .frame.on-dark{background:var(--dark);}
  .rule{height:3px;background:var(--tint);}
  .body{height:calc(100% - 3px);padding:clamp(22px,3.4vw,44px) clamp(26px,4.2vw,54px);display:flex;flex-direction:column;overflow:hidden;position:relative;}

  .kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:clamp(10px,1.6vw,16px);flex-shrink:0;}
  .kicker .tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--tint);border-radius:999px;color:var(--tint);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;}
  .kicker .tag.solid{background:var(--tint);color:var(--paper);}
  .kicker .tag .icon{width:13px;height:13px;}
  .kicker .part{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}

  h1,h2,h3,p{margin:0;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5.4vw,66px);line-height:1.02;letter-spacing:-.01em;max-width:820px;}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(24px,2.9vw,36px);line-height:1.08;letter-spacing:-.005em;margin-bottom:6px;}
  .subtitle{color:var(--muted);font-size:clamp(14.5px,1.6vw,18px);line-height:1.45;max-width:720px;font-style:italic;font-family:var(--serif);}
  .head{flex-shrink:0;margin-bottom:clamp(14px,2vw,22px);}

  .split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:clamp(22px,3.4vw,46px);align-items:stretch;}

  /* numbered rows */
  .rows-wrap{min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;}
  .rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .rows li{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);}
  .rows li:first-child{padding-top:0;}
  .rows .n{flex-shrink:0;width:24px;color:var(--tint);font-family:var(--serif);font-weight:700;font-size:15px;}
  .rows .t{color:#2e2a23;font-size:clamp(13.5px,1.32vw,16px);line-height:1.38;}
  .rows code,.notes code,.compare code,.copy code{font-family:var(--mono);font-size:.9em;color:var(--tint);}
  .rows .t b{color:var(--ink);}

  /* code */
  .code-panel{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .code-label{min-height:32px;display:flex;align-items:center;gap:7px;align-self:stretch;padding:6px 6px 6px 11px;border-radius:5px 5px 0 0;background:var(--code-bg);color:var(--code-cm);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;}
  .code-label .icon{width:13px;height:13px;color:var(--tint);}
  .code-label .grow{flex:1;}
  .copy-btn{border:1px solid rgba(239,232,219,.2);background:transparent;color:var(--code-fg);border-radius:4px;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}
  .copy-btn:hover{background:var(--code-fg);color:var(--code-bg);}
  pre{flex:1;min-height:0;margin:0;padding:clamp(14px,1.8vw,20px);overflow:auto;color:var(--code-fg);background:var(--code-bg);border-radius:0 0 6px 6px;font-family:var(--mono);font-size:clamp(11.5px,1.08vw,13.5px);line-height:1.52;white-space:pre-wrap;tab-size:4;}
  pre.out{color:#d9d1c3;}
  .kw{color:var(--code-kw);} .fn{color:var(--code-fn);} .str{color:var(--code-str);} .cm{color:var(--code-cm);font-style:italic;}
  .prompt{color:var(--code-kw);}

  /* answer slide */
  .frame.b .head{margin-bottom:12px;} .frame.b h2{font-size:clamp(21px,2.4vw,30px);margin-bottom:0;}
  pre.dense{font-size:clamp(11px,.98vw,12.5px);line-height:1.42;}
  .ans-code{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--parts,2),minmax(0,1fr));gap:14px;}
  .notes{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;}
  .notes div{border-top:3px solid var(--tint);background:#fffefb;box-shadow:0 6px 16px rgba(24,17,8,.06);padding:9px 12px;font-size:clamp(12px,1.12vw,13.5px);line-height:1.35;color:#2e2a23;}

  /* jump link */
  .jump{position:absolute;left:clamp(26px,4.2vw,54px);bottom:clamp(12px,1.8vw,18px);border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:0;}
  .jump:hover{color:var(--tint);}

  /* divider, hero, closing */
  .dark-body{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,6vw,80px);color:var(--dark-ink);}
  .dark-body .num{font-family:var(--serif);font-size:clamp(60px,9vw,120px);font-weight:600;color:var(--tint);line-height:1;opacity:.9;}
  .dark-body .p-label{margin:14px 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tint);}
  .dark-body h1{color:var(--dark-ink);}
  .dark-body .subtitle{color:rgba(244,239,228,.7);margin-top:12px;}
  .dark-body .mark{width:52px;height:52px;display:grid;place-items:center;border:1.5px solid var(--tint);border-radius:8px;color:var(--tint);margin-bottom:22px;}
  .dark-body .mark .icon{width:24px;height:24px;}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;}
  .pills span{border:1px solid rgba(244,239,228,.25);color:rgba(244,239,228,.82);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;}
  .warn{margin-top:22px;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;border:1px solid var(--tint);color:var(--dark-ink);padding:10px 14px;border-radius:7px;font-size:14px;}
  .warn .icon{color:var(--tint);}

  /* overview table */
  .table-wrap{flex:1;min-height:0;overflow:auto;}
  table.compare{width:100%;border-collapse:collapse;font-size:clamp(12.5px,1.25vw,15px);}
  .compare th,.compare td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);color:#2e2a23;}
  .compare thead th{font-family:var(--serif);font-size:clamp(14px,1.5vw,18px);font-weight:600;color:var(--tint);border-bottom:2px solid var(--tint);}
  .compare td:first-child{font-family:var(--serif);font-weight:700;color:var(--tint);white-space:nowrap;}
  .compare td:nth-child(2){color:var(--muted);font-size:.86em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
  .compare tr.go{cursor:pointer;} .compare tr.go:hover td{background:var(--tint-soft);}

  /* how-to */
  .copy{color:#3c362d;font-size:clamp(14px,1.45vw,16.5px);line-height:1.5;}
  .tree{font-family:var(--mono);}

  .slide-number{position:absolute;right:clamp(22px,3.6vw,50px);bottom:clamp(12px,1.8vw,18px);color:#9a927f;font-size:11px;font-weight:700;letter-spacing:.08em;}

  .controls{position:fixed;z-index:6;right:clamp(13px,3vw,36px);bottom:clamp(13px,2.2vw,26px);display:flex;gap:6px;align-items:center;padding:6px;border:1px solid rgba(244,239,228,.18);border-radius:8px;background:rgba(28,24,20,.9);box-shadow:0 10px 24px rgba(0,0,0,.3);}
  .control{width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--dark-ink);border:0;border-radius:5px;background:transparent;cursor:pointer;}
  .control:hover,.control:focus-visible{color:var(--dark);background:var(--dark-ink);outline:none;}
  .control:disabled{opacity:.32;cursor:default;} .control:disabled:hover{color:var(--dark-ink);background:transparent;}
  .counter{min-width:50px;color:var(--dark-ink);text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;}
  .progress{position:fixed;z-index:7;left:0;right:0;bottom:0;height:4px;background:rgba(244,239,228,.15);}
  .progress span{display:block;height:100%;width:0;background:var(--accent-a);transition:width .25s ease;}

  @media (max-height:760px) and (min-width:761px){
    .slide{padding-top:48px;padding-bottom:60px;}
    .frame{height:calc(100dvh - 108px);}
    .body{padding:20px 40px;}
    h2{font-size:clamp(21px,2.6vw,30px);}
    .rows li{padding:6px 0;}
  }
  @media (max-width:860px){
    .brand{font-size:9.5px;}
    .slide{padding:52px 10px 70px;}
    .frame{height:calc(100dvh - 124px);min-height:0;}
    .body{padding:20px 18px;overflow:auto;}
    .split,.ans-code{display:flex;flex-direction:column;gap:14px;flex:none;}
    .rows-wrap{overflow:visible;}
    pre{flex:none;max-height:none;}
    .notes{grid-template-columns:1fr;}
    .jump{position:static;margin-top:14px;text-align:left;}
    .slide-number{display:none;}
    .controls .control:first-child{display:none;} .control{width:31px;height:31px;}
  }
  @media print{
    body{overflow:visible;background:#fff;}
    .brand,.controls,.progress,.jump,.copy-btn{display:none!important;}
    .deck,.slides{min-height:auto;}
    .slide{position:relative;display:block;opacity:1!important;transform:none!important;padding:0;page-break-after:always;}
    .frame{width:100%;height:100vh;border-radius:0;box-shadow:none;}
    pre{overflow:visible;}
  }
</style>
</head>

  <div class="brand"><span class="mark">Py</span>Dashain Task &bull; Day 01 to 15</div>

<script>
/* Every answer below was run in Python 3 before it went on a slide. */
const TASKS = [
 {
  "days": "Day 01 – 02",
  "topic": "Python setup, venv and Git",
  "icon": "branch",
  "lang": "bash",
  "title": "Set up your Dashain project",
  "subtitle": "Every task after this one lives in this folder, on GitHub.",
  "rows": [
   "Make a folder called <code>dashain-task<\/code> and open it in the terminal",
   "Create a virtual environment called <code>.venv<\/code>, then activate it",
   "Install the <code>requests<\/code> package. Check it with <code>pip list<\/code>",
   "Create <code>hello.py<\/code> that prints <code>Happy Dashain!<\/code> and run it",
   "Run <code>git init<\/code>. Add a <code>.gitignore<\/code> that skips <code>.venv/<\/code>",
   "Commit, then push to a new empty GitHub repo",
   "Make a branch <code>tasks<\/code>, commit one change there, merge it into <code>main<\/code>"
  ],
  "sample_label": "What you should see",
  "sample": "(.venv) $ python hello.py\nHappy Dashain!\n\n(.venv) $ git log --oneline\nc3d9e21 Add greeting for Sita\na17f0b4 Add hello.py and .gitignore\n\n(.venv) $ git branch\n* main\n  tasks\n\n(.venv) $ git status\nOn branch main\nnothing to commit, working tree clean",
  "answer": [
   "# 1. Make the folder\nmkdir dashain-task\ncd dashain-task\n\n# 2. Virtual environment\npython3 -m venv .venv\nsource .venv/bin/activate\n# Windows: .venv\\Scripts\\activate\n\n# 3. Install a package\npip install requests\npip list\n\n# 4. First program\necho 'print(\"Happy Dashain!\")' > hello.py\npython hello.py",
   "# 5. Git + .gitignore\ngit init\necho \".venv/\" > .gitignore\ngit add .\ngit commit -m \"Add hello.py and .gitignore\"\n\n# 6. Push to GitHub (make an empty repo first)\ngit remote add origin https://github.com/<you>/dashain-task.git\ngit branch -M main\ngit push -u origin main\n\n# 7. Branch, change, merge\ngit switch -c tasks\necho 'print(\"Namaste Sita!\")' >> hello.py\ngit add hello.py\ngit commit -m \"Add greeting for Sita\"\ngit switch main\ngit merge tasks\ngit push"
  ],
  "notes": [
   "<code>.venv<\/code> keeps packages inside this one project",
   "<code>.gitignore<\/code> stops <code>.venv/<\/code> going to GitHub",
   "branch → commit → <code>switch main<\/code> → <code>merge<\/code>"
  ]
 },
 {
  "days": "Day 03",
  "topic": "Numbers and strings",
  "icon": "text",
  "lang": "python",
  "title": "Dashain shopping receipt",
  "subtitle": "Ask the shopper a few questions, then print a neat receipt.",
  "rows": [
   "Ask for name, item, price and quantity with <code>input()<\/code>",
   "Change price to <code>float<\/code> and quantity to <code>int<\/code>",
   "Show the name in Title Case and the item in CAPITALS",
   "Make an item code from the first 3 letters (slicing)",
   "Print the total with 2 decimals using an f-string",
   "Use <code>//<\/code> and <code>%<\/code>: how many Rs 500 notes, and what is left",
   "Print <code>True<\/code>/<code>False<\/code>: is the total over Rs 1000? Then print <code>type(price)<\/code>"
  ],
  "sample_label": "Sample run",
  "sample": "Your name: ram bahadur\nItem: tika set\nPrice: 250.50\nQuantity: 3\n------ DASHAIN RECEIPT ------\nCustomer : Ram Bahadur\nItem     : TIKA SET (code: TIK)\nTotal    : Rs 751.50\n500 notes: 1, left Rs 251.50\nOver 1000? False\nPrice type: <class 'float'>",
  "answer": [
   "name = input(\"Your name: \")\nitem = input(\"Item: \")\nprice = float(input(\"Price: \"))\nqty = int(input(\"Quantity: \"))",
   "total = price * qty\ncode = item[:3].upper()\n\nprint(\"------ DASHAIN RECEIPT ------\")\nprint(f\"Customer : {name.title()}\")\nprint(f\"Item     : {item.upper()} (code: {code})\")\nprint(f\"Total    : Rs {total:.2f}\")\nprint(f\"500 notes: {int(total // 500)}, left Rs {total % 500:.2f}\")\nprint(\"Over 1000?\", total > 1000)\nprint(\"Price type:\", type(price))"
  ],
  "notes": [
   "<code>input()<\/code> always gives text. Convert it first",
   "<code>:.2f<\/code> shows 2 decimals inside an f-string",
   "<code>//<\/code> gives whole notes, <code>%<\/code> gives what is left"
  ]
 },
 {
  "days": "Day 04",
  "topic": "Lists",
  "icon": "list",
  "lang": "python",
  "title": "Kite shop stock list",

const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const PY_KW = /\b(if|elif|else|match|case|for|while|in|not|and|or|del|def|return|import|from|as|True|False|None|pass|break|continue|lambda|yield|try|except|finally|raise|is)\b/;
function highlight(code, lang){
  if (lang === "out") return highlightOut(code);
  const re = lang === "bash"
    ? /(#[^\n]*)|("[^"\n]*"|'[^'\n]*')|(^|\n)([a-z][\w-]*)/g
    : new RegExp(/(#[^\n]*)|(f?"[^"\n]*"|f?'[^'\n]*')|/.source + PY_KW.source + /|\b([A-Za-z_]\w*)(?=\()/.source, "g");
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    if (lang === "bash" && m[4]){
      out += esc(code.slice(last, m.index)) + esc(m[3]) + `<span class="fn">${esc(m[4])}</span>`;
    } else {
      const cls = m[1] ? "cm" : m[2] ? "str" : (lang !== "bash" && m[3]) ? "kw" : "fn";
      out += esc(code.slice(last, m.index)) + `<span class="${cls}">${esc(m[0])}</span>`;
    }
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
/* Sample output: colour the shell prompt, and what the user typed after an input() prompt. */
function highlightOut(text){
  return text.split("\n").map(line => {
    let m = line.match(/^(\(\.venv\) \$ )(.*)$/);
    if (m) return `<span class="cm">${esc(m[1])}</span><span class="prompt">${esc(m[2])}</span>`;
    m = line.match(/^((?:Your name|Item|Price|Quantity|Name|Age|Height \(cm\)|Coupon code|Amount|Item \(or done\)|1 Add  2 Spend  3 Balance  4 Quit): ?)(.*)$/);
    if (m) return esc(m[1]) + `<span class="str">${esc(m[2])}</span>`;
    return esc(line);
  }).join("\n");
}

function render(s, index){
  const total = slides.length;
  const num = `<div class="slide-number">${pad(index + 1)} / ${pad(total)}</div>`;
  if (s.kind === "hero") return `<div class="frame on-dark"><div class="rule"></div><div class="dark-body">
      <div class="mark"><svg class="icon"><use href="#kite"/></svg></div>
      <div class="p-label">Dashain Holiday Task</div>
      <h1>Python, Day 01 to Day 15</h1>
      <p class="subtitle">Ten small tasks that cover everything we have learned so far. Questions first, then all the answers at the end.</p>
      <div class="pills">${ALL_DAYS.split(" · ").map(t => `<span>${t}</span>`).join("")}</div>
    </div></div>`;
  if (s.kind === "howto") return `<div class="frame"><div class="rule"></div><div class="body">
      <div class="head">${kicker("a","pen","Before you start","How to do this task")}<h2>How to do the tasks</h2><p class="subtitle">About 20 to 30 minutes for each task. Take your time over Dashain.</p></div>
      <div class="split">
        <div class="rows-wrap"><ol class="rows">${[
          "Do <b>Task 01</b> first. It makes the folder and GitHub repo for all the others",
          "Make one file per task: <code>task_02.py</code>, <code>task_03.py</code> …",
          "Each task tells you which days it uses. Open those slides if you get stuck",
          "Your output should match the sample on the right side of each task",
          "Commit after every task, then <code>git push</code>",
          "Only look at the answers <b>after</b> you have tried"
        ].map((t, k) => `<li><span class="n">${pad(k + 1)}</span><span class="t">${t}</span></li>`).join("")}</ol></div>
        ${codePanel("Your folder at the end", "box", `dashain-task/
├── .venv/          (not on GitHub)
├── .gitignore
├── hello.py
├── task_02.py
├── task_03.py
├── ...
└── task_10.py`, "out")}
      </div>${num}</div></div>`;
  if (s.kind === "overview") return `<div class="frame"><div class="rule"></div><div class="body">
      <div class="head">${kicker("a","list","Overview","10 tasks · 15 days")}<h2>What each task covers</h2><p class="subtitle">Day 13 was revision, so Task 10 uses a bit of every day. Click a row to jump to that task.</p></div>
      <div class="table-wrap"><table class="compare"><thead><tr><th>Task</th><th>Days</th><th>Topic</th><th>You will build</th></tr></thead><tbody>
      ${TASKS.map((t, i) => `<tr class="go" data-go="${taskSlide(i)}"><td>${pad(i + 1)}</td><td>${t.days}</td><td>${esc(t.topic)}</td><td>${esc(t.title)}</td></tr>`).join("")}
      </tbody></table></div>${num}</div></div>`;
  if (s.kind === "divider") return `<div class="frame on-dark ${s.tint}"><div class="rule"></div><div class="dark-body">
      <div class="num">${s.num}</div><div class="p-label">${s.label}</div><h1>${s.title}</h1><p class="subtitle">${s.subtitle}</p>
      ${s.warn ? `<div class="warn"><svg class="icon"><use href="#alert"/></svg>Spoilers ahead. Try every task on your own before you look.</div>` : ""}
    </div></div>`;
  if (s.kind === "task"){
    const t = TASKS[s.i];
    return `<div class="frame"><div class="rule"></div><div class="body">
      <div class="head">${kicker("a", t.icon, `Task ${pad(s.i + 1)}`, `${t.days} · ${esc(t.topic)}`)}<h2>${esc(t.title)}</h2><p class="subtitle">${esc(t.subtitle)}</p></div>
      <div class="split">
        <div class="rows-wrap"><ol class="rows">${t.rows.map((r, k) => `<li><span class="n">${pad(k + 1)}</span><span class="t">${r}</span></li>`).join("")}</ol></div>
        ${codePanel(t.sample_label, "play", t.sample, "out")}
      </div>
      <button class="jump" data-go="${answerSlide(s.i)}">Answer is on slide ${answerSlide(s.i) + 1} →</button>${num}</div></div>`;
  }
  if (s.kind === "answer"){
    const t = TASKS[s.i];
    const parts = t.answer;
    const file = t.lang === "bash" ? "terminal" : `task_${pad(s.i + 1)}.py`;
    return `<div class="frame b"><div class="rule"></div><div class="body">
      <div class="head">${kicker("b", "check", `Answer ${pad(s.i + 1)}`, `${t.days} · ${esc(t.topic)}`, true)}<h2>${esc(t.title)}</h2></div>
      <div class="ans-code" style="--parts:${parts.length}">${parts.map((p, k) =>
        codePanel(k === 0 ? file : `${file} · continued`, "code", p, t.lang, k === 0 ? s.i : undefined, parts.length > 2)).join("")}</div>
      <div class="notes">${t.notes.map(n => `<div>${n}</div>`).join("")}</div>
      <button class="jump" data-go="${taskSlide(s.i)}">← Back to task ${pad(s.i + 1)}</button>${num}</div></div>`;
  }
  if (s.kind === "closing") return `<div class="frame on-dark b"><div class="rule"></div><div class="dark-body">
      <div class="mark"><svg class="icon"><use href="#kite"/></svg></div>
      <div class="p-label">That's all ten</div>
      <h1>Happy Dashain!</h1>
      <p class="subtitle">Push all ten tasks to GitHub, then try the Day 01–15 quiz. Bring your questions to the next class.</p>
      <div class="pills"><span>git add .</span><span>git commit -m "Dashain tasks"</span><span>git push</span></div>
    </div></div>`;
}

/* ───────── deck engine ───────── */
const box = document.getElementById("slides");
box.innerHTML = slides.map((s, i) => `<section class="slide" aria-label="Slide ${i + 1}">${render(s, i)}</section>`).join("");
const els = [...box.children];
let current = 0;

function go(n){
  current = Math.max(0, Math.min(slides.length - 1, n));
  els.forEach((el, i) => {
    el.classList.toggle("active", i === current);
    el.classList.toggle("past", i < current);
    el.setAttribute("aria-hidden", i !== current);
  });
  document.getElementById("counter").textContent = `${pad(current + 1)} / ${pad(slides.length)}`;
  document.getElementById("progress").style.width = `${((current + 1) / slides.length) * 100}%`;
  document.getElementById("previousButton").disabled = current === 0;
  document.getElementById("nextButton").disabled = current === slides.length - 1;
  history.replaceState(null, "", `#${current + 1}`);
}
document.getElementById("homeButton").onclick = () => go(0);
document.getElementById("previousButton").onclick = () => go(current - 1);
document.getElementById("nextButton").onclick = () => go(current + 1);
document.getElementById("fullButton").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

box.addEventListener("click", e => {
  const jump = e.target.closest("[data-go]");
  if (jump){ go(+jump.dataset.go); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy){
    const text = TASKS[+copy.dataset.copy].answer.join("\n");
    const done = () => { copy.textContent = "Copied!"; setTimeout(() => copy.textContent = "Copy code", 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
});
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (err) {}
  ta.remove();
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " "){ e.preventDefault(); go(current + 1); }
  else if (k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); go(current - 1); }
  else if (k === "Home"){ e.preventDefault(); go(0); }
  else if (k === "End"){ e.preventDefault(); go(slides.length - 1); }
  else if (k.toLowerCase() === "f"){ e.preventDefault(); document.getElementById("fullButton").click(); }
});

/* swipe on phones */
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive:true });
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) go(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

const start = parseInt(location.hash.slice(1), 10);
go(Number.isFinite(start) ? start - 1 : 0);
</script>
