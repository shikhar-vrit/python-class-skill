<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#201d19">
<title>Day 03 — Python Numbers &amp; Strings</title>
<style>
  :root{
    --bg:#f6f2ea; --paper:#fffdf8; --ink:#221f1a; --muted:#726b5e; --line:#e6ddc9;
    --accent-a:#b1502e; --accent-a-soft:#f3ded0;
    --accent-b:#2f5d52; --accent-b-soft:#dfe9e2;
    --dark:#201d19; --dark-ink:#f4efe4;
    --code-bg:#1c1815; --code-fg:#efe8db; --code-kw:#8fd6c4; --code-str:#e9b483; --code-cm:#8a8277; --code-fn:#e7cd8f;
    --shadow:0 26px 60px rgba(24,17,8,.22), 0 4px 14px rgba(24,17,8,.1);
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;overflow:hidden;background:var(--dark);color:var(--ink);font-family:var(--sans);}
  button{font:inherit;}
  .sprite{position:absolute;width:0;height:0;overflow:hidden;}
  .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .deck{min-height:100dvh;position:relative;background:var(--dark);}
  .brand{position:fixed;z-index:5;top:clamp(14px,2.4vw,26px);left:clamp(16px,3vw,38px);display:flex;align-items:center;gap:9px;color:var(--dark-ink);opacity:.72;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;}
  .brand .mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(244,239,228,.4);border-radius:5px;font-family:var(--serif);font-size:12px;font-weight:700;}

  .slides{min-height:100dvh;position:relative;z-index:1;}
  .slide{position:absolute;inset:0;display:grid;place-items:center;padding:clamp(60px,7.5vw,88px) clamp(16px,6vw,90px) clamp(72px,8.5vw,104px);opacity:0;pointer-events:none;transform:translateX(38px);transition:opacity .22s ease, transform .32s cubic-bezier(.2,.75,.25,1);}
  .slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
  .slide.past{transform:translateX(-38px);}

  .frame{--tint:var(--accent-a);--tint-soft:var(--accent-a-soft);width:min(1140px,100%);height:min(640px,calc(100dvh - 128px));min-height:420px;position:relative;overflow:hidden;border-radius:10px;background:var(--paper);box-shadow:var(--shadow);}
  .frame.b{--tint:var(--accent-b);--tint-soft:var(--accent-b-soft);}
  .frame.on-dark{background:var(--dark);}
  .rule{height:3px;background:var(--tint);}

  .body{height:calc(100% - 3px);padding:clamp(26px,4vw,52px) clamp(30px,4.6vw,58px);display:flex;flex-direction:column;overflow:hidden;position:relative;}

  .kicker{display:flex;align-items:center;gap:10px;margin-bottom:clamp(14px,2vw,22px);flex-shrink:0;}
  .kicker .tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--tint);border-radius:999px;color:var(--tint);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;}
  .kicker .tag .icon{width:13px;height:13px;}
  .kicker .part{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}

  h1,h2,h3,p{margin:0;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5.4vw,66px);line-height:1.02;letter-spacing:-.01em;max-width:760px;}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(25px,3.1vw,38px);line-height:1.08;letter-spacing:-.005em;max-width:780px;margin-bottom:clamp(10px,1.6vw,16px);}
  .subtitle{color:var(--muted);font-size:clamp(15px,1.7vw,19px);line-height:1.45;max-width:660px;font-style:italic;font-family:var(--serif);}
  .copy{margin-top:12px;color:#3c362d;font-size:clamp(14.5px,1.5vw,17px);line-height:1.52;max-width:640px;}

  .content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;}
  .split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(240px,.9fr) minmax(320px,1.05fr);gap:clamp(24px,4vw,54px);align-items:center;}
  .split.wide-left{grid-template-columns:minmax(260px,1.05fr) minmax(280px,.95fr);}

  /* numbered rows list */
  .rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .rows li{display:flex;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);}
  .rows li:first-child{padding-top:0;}
  .rows .n{flex-shrink:0;width:26px;color:var(--tint);font-family:var(--serif);font-weight:700;font-size:15px;}
  .rows .t{color:#2e2a23;font-size:clamp(14px,1.35vw,16.5px);line-height:1.36;}
  .rows.compact li{padding:7px 0;}

  /* flow / process steps */
  .flow{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;gap:0;}
  .flow-step{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:18px 12px;position:relative;}
  .flow-step .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--tint-soft);color:var(--tint);}
  .flow-step .ic .icon{width:20px;height:20px;}
  .flow-step strong{font-family:var(--serif);font-size:clamp(15px,1.55vw,19px);font-weight:600;}
  .flow-step small{color:var(--muted);font-size:12.5px;line-height:1.35;max-width:160px;}
  .flow-connector{align-self:center;width:100%;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px);position:relative;top:-46px;margin:0 -8%;}
  .flow-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}

  /* quote / problem callout */
  .quote{border-left:3px solid var(--tint);background:var(--tint-soft);padding:clamp(22px,3.2vw,34px);border-radius:0 6px 6px 0;}
  .quote p{font-family:var(--serif);font-size:clamp(19px,2.3vw,27px);font-weight:600;line-height:1.28;color:#2a251e;}
  .quote p strong{color:var(--tint);}

  /* code */
  .code-panel{height:100%;display:flex;flex-direction:column;min-height:0;}
  .code-label{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:6px 11px;border-radius:5px 5px 0 0;background:var(--code-bg);color:var(--code-cm);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;}
  .code-label .icon{width:13px;height:13px;color:var(--tint);}
  pre{flex:1;min-height:190px;max-height:360px;margin:0;padding:clamp(16px,2.2vw,24px);overflow:auto;color:var(--code-fg);background:var(--code-bg);border-radius:0 6px 6px 6px;font-family:var(--mono);font-size:clamp(12px,1.15vw,14.5px);line-height:1.6;white-space:pre-wrap;}
  .kw{color:var(--code-kw);} .fn{color:var(--code-fn);} .str{color:var(--code-str);} .cm{color:var(--code-cm);font-style:italic;}

  /* divider slide */
  .divider-body{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,6vw,80px);color:var(--dark-ink);}
  .divider-body .num{font-family:var(--serif);font-size:clamp(60px,9vw,120px);font-weight:600;color:var(--tint);line-height:1;opacity:.9;}
  .divider-body .p-label{margin:14px 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,239,228,.55);}
  .divider-body h1{color:var(--dark-ink);font-size:clamp(34px,5vw,58px);}
  .divider-body .subtitle{color:rgba(244,239,228,.68);font-style:italic;}

  /* hero / closing */
  .hero-body,.closing-body{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,6vw,80px);color:var(--dark-ink);}
  .hero-body .mark,.closing-body .mark{width:52px;height:52px;display:grid;place-items:center;border:1.5px solid var(--tint);border-radius:8px;color:var(--tint);margin-bottom:22px;}
  .hero-body .p-label,.closing-body .p-label{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tint);margin-bottom:12px;}
  .hero-body h1,.closing-body h1{color:var(--dark-ink);}
  .hero-body .subtitle,.closing-body .subtitle{color:rgba(244,239,228,.68);}

  /* practice */
  .practice-box{border-left:3px solid var(--tint);background:var(--tint-soft);padding:clamp(20px,2.8vw,30px);border-radius:0 6px 6px 0;}
  .practice-box h3{font-family:var(--serif);font-size:clamp(19px,2.1vw,24px);margin-bottom:9px;}
  .practice-box p{color:#3c362d;font-size:clamp(14px,1.5vw,17px);line-height:1.48;}

  /* cheatsheet */
  .cheatgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center;}
  .cheatcard{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fffefb;}
  .cheatcard code{display:block;font-family:var(--mono);font-size:12.5px;color:var(--tint);margin-bottom:5px;word-break:break-word;}
  .cheatcard small{color:var(--muted);font-size:11.5px;line-height:1.3;display:block;}

  /* remember */
  .remember{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .remember-item{border-top:3px solid var(--tint);padding:14px 12px;background:#fffefb;box-shadow:0 6px 16px rgba(24,17,8,.06);display:flex;flex-direction:column;gap:8px;}
  .remember-item .n{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--tint);}
  .remember-item p{font-size:12.5px;line-height:1.36;color:#2e2a23;}

  .slide-number{position:absolute;right:clamp(22px,3.6vw,50px);bottom:clamp(16px,2.4vw,26px);color:#9a927f;font-size:11px;font-weight:700;letter-spacing:.08em;}

  .controls{position:fixed;z-index:6;right:clamp(13px,3vw,36px);bottom:clamp(13px,2.2vw,26px);display:flex;gap:6px;align-items:center;padding:6px;border:1px solid rgba(244,239,228,.18);border-radius:8px;background:rgba(28,24,20,.9);box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .control{width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--dark-ink);border:0;border-radius:5px;background:transparent;cursor:pointer;}
  .control:hover,.control:focus-visible{color:var(--dark);background:var(--dark-ink);outline:none;}
  .control:disabled{opacity:.32;cursor:default;} .control:disabled:hover{color:var(--dark-ink);background:transparent;}
  .counter{min-width:50px;color:var(--dark-ink);text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;}
  .progress{position:fixed;z-index:7;left:0;right:0;bottom:0;height:4px;background:rgba(244,239,228,.15);}
  .progress span{display:block;height:100%;width:0;background:var(--accent-a);transition:width .25s ease;}

  @media (max-height:760px) and (min-width:761px){
    .slide{padding-top:54px;padding-bottom:66px;}
    .frame{height:calc(100dvh - 120px);}
    .body{padding:24px 42px;}
    h2{font-size:clamp(22px,2.8vw,32px);}
  }

  @media (max-width:760px){
    .brand{font-size:9.5px;}
    .slide{padding:56px 12px 72px;} .frame{height:min(760px,calc(100dvh - 132px));min-height:0;}
    .body{padding:22px;overflow:auto;}
    .split,.split.wide-left{grid-template-columns:1fr;gap:16px;}
    .flow{grid-template-columns:1fr;gap:14px;} .flow-connector{display:none;}
    .flow-step{flex-direction:row;text-align:left;justify-content:flex-start;padding:6px 0;}
    .cheatgrid{grid-template-columns:1fr;} .remember{grid-template-columns:1fr;}
    pre{min-height:160px;max-height:260px;}
    .controls .control:first-child{display:none;} .control{width:31px;height:31px;}
  }
  @media print{
    body{overflow:visible;background:#fff;}
    .brand,.controls,.progress{display:none;}
    .deck,.slides{min-height:auto;}
    .slide{position:relative;display:block;opacity:1!important;transform:none!important;padding:0;page-break-after:always;}
    .frame{width:100%;height:100vh;border-radius:0;box-shadow:none;}
  }
</style>
</head>

<script>
const slides = [
  { kind:"hero", tint:"a", icon:"hash", part:"Day 03", eyebrow:"Python Numbers & Strings",
    title:"Numbers & Strings", subtitle:"Turn Python into a calculator, then teach it to work with words — through three hands-on projects." },

  { kind:"remember", tint:"b", icon:"history", part:"Recap · Day 02", title:"What we learned yesterday",
    subtitle:"Git & GitHub CLI — a quick refresher before we start something new.",
    items:["Git saves snapshots of your project so you never lose work — .gitignore skips junk files.",
      "add stages changes, commit saves them, log shows the history.",
      "GitHub is the website home for your code — sign up and create the repo there first.",
      "gh auth login signs you in via the browser — no SSH keys or tokens to paste.",
      "Branches keep main safe. Pull often, commit small, fix conflicts by editing markers."] },

  { kind:"divider", tint:"a", icon:"hash", part:"Part 01", title:"Numbers in Python",
    subtitle:"int and float — how Python does math." },

  { kind:"bullets", tint:"a", icon:"hash", part:"Part 01 · Numbers", title:"Two types of numbers",
    subtitle:"Whole numbers vs. decimals — Python treats them differently.",
    copy:"You don't declare the type yourself — Python figures it out from how you write the value.",
    rows:["int stores whole numbers — age = 15, no decimal point","float stores decimal numbers — price = 9.99","Never put quotes around a number — 15 is a number, \"15\" is text","Negative numbers work exactly the same way — score = -5"] },

  { kind:"code", tint:"a", icon:"text", part:"Part 01 · Numbers", title:"f-strings — mixing text and numbers",
    subtitle:"Put an f in front of a string, then drop variables inside { }.",
    copy:"You'll use this in almost every print() from now on — it's the cleanest way to build output.",
    code:`name = "Maya"
age = 15

print(f"{name} is {age} years old")
# Maya is 15 years old

# Any expression works inside { }
price = 250

const icon = name => `<svg class="icon" aria-hidden="true"><use href="#${name}"></use></svg>`;
const escapeHtml = value => value.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function highlight(code){
  let html = escapeHtml(code);
  html = html.replace(/(#[^\n]*)/g, '<span class="cm">$1</span>');
  html = html.replace(/("[^"\n]*"|'[^'\n]*')/g, '<span class="str">$1</span>');
  html = html.replace(/(^|[^\w])(if|elif|else|for|while|in|break|continue|and|or|not|def|return|print|import|from|as|True|False|match|case|pass)(?=\b)/gm, '$1<span class="kw">$2</span>');
  html = html.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="fn">$1</span>');
  return html;
}
const codeBlock = code => `<div class="code-panel"><div class="code-label">${icon("code")} Python</div><pre><code>${highlight(String(code ?? ""))}</code></pre></div>`;
const pageNo = index => `<span class="slide-number">${String(index+1).padStart(2,"0")} / ${String(slides.length).padStart(2,"0")}</span>`;
const kicker = slide => `<div class="kicker"><span class="tag">${icon(slide.icon)}${slide.eyebrow || "Numbers & Strings"}</span>${slide.part ? `<span class="part">${slide.part}</span>` : ""}</div>`;
const rowsList = (items, compact) => `<ul class="rows${compact ? " compact" : ""}">${items.map((t,i)=>`<li><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${t}</span></li>`).join("")}</ul>`;

function renderFlow(steps){
  return `<div class="flow-wrap"><div class="flow-connector"></div><div class="flow">${steps.map(s=>`<div class="flow-step"><div class="ic">${icon(s.icon)}</div><strong>${s.label}</strong><small>${s.text}</small></div>`).join("")}</div></div>`;
}

function renderSlide(slide, index){
  const tintClass = slide.tint === "b" ? "b" : "";
  let body;
  if (slide.kind === "hero"){
    body = `<div class="hero-body"><div class="mark">${icon(slide.icon)}</div><p class="p-label">${slide.eyebrow}</p><h1>${slide.title}</h1><p class="subtitle">${slide.subtitle}</p></div>${pageNo(index)}`;
    return `<article class="slide" data-index="${index}" aria-hidden="${index===0?"false":"true"}"><div class="frame ${tintClass} on-dark"><div class="rule"></div><div style="height:calc(100% - 3px)">${body}</div></div></article>`;
  }
  if (slide.kind === "closing"){
    body = `<div class="closing-body"><div class="mark">${icon(slide.icon)}</div><p class="p-label">${slide.part}</p><h1>${slide.title}</h1><p class="subtitle">${slide.subtitle}</p></div>${pageNo(index)}`;
    return `<article class="slide" data-index="${index}" aria-hidden="true"><div class="frame ${tintClass} on-dark"><div class="rule"></div><div style="height:calc(100% - 3px)">${body}</div></div></article>`;
  }
  if (slide.kind === "divider"){
    body = `<div class="divider-body"><span class="num">${slide.part.replace(/\D/g,"").padStart(2,"0")}</span><p class="p-label">${slide.part}</p><h1>${slide.title}</h1><p class="subtitle">${slide.subtitle}</p></div>${pageNo(index)}`;
    return `<article class="slide" data-index="${index}" aria-hidden="true"><div class="frame ${tintClass} on-dark"><div class="rule"></div><div style="height:calc(100% - 3px)">${body}</div></div></article>`;
  }

  if (slide.kind === "bullets"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><div class="split">
      <div><p class="subtitle">${slide.subtitle}</p>${slide.copy ? `<p class="copy">${slide.copy}</p>` : ""}</div>
      <div>${rowsList(slide.rows)}</div>
    </div>${pageNo(index)}</div>`;
  } else if (slide.kind === "flow"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><p class="subtitle" style="margin-bottom:8px">${slide.subtitle}</p>${renderFlow(slide.steps)}${pageNo(index)}</div>`;
  } else if (slide.kind === "quote"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><div class="split wide-left">
      <div><p class="subtitle">${slide.subtitle}</p>${rowsList(slide.rows, true)}</div>
      <div class="quote"><p>${slide.quote}</p></div>
    </div>${pageNo(index)}</div>`;
  } else if (slide.kind === "code"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><div class="split">
      <div><p class="subtitle">${slide.subtitle}</p>${slide.copy ? `<p class="copy">${slide.copy}</p>` : ""}</div>
      ${codeBlock(slide.code)}
    </div>${pageNo(index)}</div>`;
  } else if (slide.kind === "practice"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><div class="split">
      <div class="practice-box"><h3>${slide.subtitle}</h3><p>${slide.task}</p></div>
      ${codeBlock(slide.code)}
    </div>${pageNo(index)}</div>`;
  } else if (slide.kind === "cheatsheet"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><p class="subtitle" style="margin-bottom:10px">${slide.subtitle}</p>
      <div class="cheatgrid">${slide.entries.map(e=>`<div class="cheatcard"><code>${escapeHtml(e.cmd)}</code><small>${e.desc}</small></div>`).join("")}</div>
    ${pageNo(index)}</div>`;
  } else if (slide.kind === "remember"){
    body = `<div class="body">${kicker(slide)}<h2>${slide.title}</h2><p class="subtitle" style="margin-bottom:10px">${slide.subtitle}</p>
      <div class="remember">${slide.items.map((t,i)=>`<div class="remember-item"><span class="n">${i+1}</span><p>${t}</p></div>`).join("")}</div>
    ${pageNo(index)}</div>`;
  }
  return `<article class="slide" data-index="${index}" aria-hidden="${index===0?"false":"true"}"><div class="frame ${tintClass}"><div class="rule"></div>${body}</div></article>`;
}

const slidesRoot = document.getElementById("slides");
slidesRoot.innerHTML = slides.map(renderSlide).join("");
const pages = [...document.querySelectorAll(".slide")];
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
let current = 0, startX = 0, startY = 0;

function goTo(index, direction = 1, updateHash = true){
  const target = Math.max(0, Math.min(slides.length - 1, index));
  if (target === current && index !== 0) return;
  pages.forEach((page, pageIndex) => {
    page.classList.toggle("active", pageIndex === target);
    page.classList.toggle("past", pageIndex < target && direction > 0);
    page.setAttribute("aria-hidden", String(pageIndex !== target));
  });
  current = target;
  counter.textContent = `${String(current+1).padStart(2,"0")} / ${String(slides.length).padStart(2,"0")}`;
  progress.style.width = `${((current+1)/slides.length)*100}%`;
  previousButton.disabled = current === 0;
  nextButton.disabled = current === slides.length - 1;
  if (updateHash) history.replaceState(null, "", `#slide-${current+1}`);
}
function next(){ goTo(current+1, 1); }
function previous(){ goTo(current-1, -1); }

document.getElementById("homeButton").addEventListener("click", () => goTo(0, -1));
previousButton.addEventListener("click", previous);
nextButton.addEventListener("click", next);
async function toggleFullscreen(){
  if (document.fullscreenElement) await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
}
document.getElementById("fullButton").addEventListener("click", toggleFullscreen);
document.addEventListener("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(event.key)) { event.preventDefault(); next(); }
  if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(event.key)) { event.preventDefault(); previous(); }
  if (event.key === "Home") { event.preventDefault(); goTo(0, -1); }
  if (event.key === "End") { event.preventDefault(); goTo(slides.length-1, 1); }
  if (event.key === "f" || event.key === "F") { event.preventDefault(); toggleFullscreen(); }
});
slidesRoot.addEventListener("touchstart", event => { const t = event.changedTouches[0]; startX = t.clientX; startY = t.clientY; }, {passive:true});
slidesRoot.addEventListener("touchend", event => { const t = event.changedTouches[0]; const x = t.clientX-startX, y = t.clientY-startY; if (Math.abs(x) > 48 && Math.abs(x) > Math.abs(y)) x < 0 ? next() : previous(); }, {passive:true});

const requested = Number((location.hash.match(/slide-(\d+)/) || [])[1]);
goTo(Number.isFinite(requested) && requested > 0 ? requested-1 : 0, 1, false);
</script>
